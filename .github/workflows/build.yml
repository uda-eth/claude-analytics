name: build

on:
  push:
    branches: [main]
    paths: ["data/**", "scripts/build.py"]
  schedule:
    - cron: "17 8 * * *" # daily, so the streak display rolls over even on quiet days
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/data.json
          git diff --cached --quiet && exit 0
          git commit -m "build: combined stats"
          git pull --rebase
          git push
